<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM QueueHub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
        url('background2.jpg') no-repeat center center/cover;
}

.main-container {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}

/* HEADER */
.header {
    margin-bottom: 30px;
}

.logo-placeholder {
    width: 90px;
    height: 90px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.logo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.header h1 {
    font-size: 32px;
    font-weight: 700;
    color: #d4f5d4;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
}

.header p {
    font-size: 14px;
    color: #a8e6a3;
}

/* CARD CONTAINER */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    margin-bottom: 20px;
}

.card-container {
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    width: 220px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.card h2 {
    margin-bottom: 10px;
}

.card p {
    font-size: 14px;
    color: #666;
}

/* LIVE STATUS */
.live-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 20px;
    color: white;
}

.live-box h3 {
    color: #d4f5d4;
}

#currentQueue {
    font-size: 40px;
    margin: 10px 0;
    color: white;
}

#status {
    color: #a8e6a3;
}

#count {
    color: white;
    margin-top: 5px;
}

/* FOOTER */
.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #d4f5d4;
    opacity: 0.9;
}

/* ANIMATION */
.pulse {
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.7;
    }
}

@media (max-width: 768px) {
    .card-container {
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>

<body>

<div class="main-container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo-placeholder">
            <img src="cmlogo.png" alt="School Logo">
        </div>

        <h1>CM QueueHub</h1>
        <p>Smart Queue Management System</p>
    </div>

    <!-- USER OPTIONS -->
    <div class="container">

        <div class="card-container">

            <div class="card" onclick="goToPage('admin')">
                <div class="icon">🛠️</div>
                <h2>Admin</h2>
                <p>Manage queues and monitor system</p>
            </div>

            <div class="card" onclick="goToPage('student')">
                <div class="icon">🎓</div>
                <h2>Student</h2>
                <p>Get queue number and track status</p>
            </div>

            <div class="card" onclick="goToPage('visitor')">
                <div class="icon">👤</div>
                <h2>Visitor</h2>
                <p>Quick access without account</p>
            </div>

        </div>

    </div>

    <!-- LIVE STATUS -->
    <div class="live-box">

        <h3>🔴 Live Queue Status</h3>

        <div id="currentQueue" class="pulse">---</div>

        <p id="status">Connecting...</p>

        <p id="count">Loading...</p>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 CM QueueHub | College of Maasin
    </div>

</div>

<!-- QUEUE SYSTEM -->
<script src="queue-system.js"></script>

<script>

/* PAGE NAVIGATION */
function goToPage(type) {

    document.body.style.opacity = "0.5";
    document.body.style.transition = "0.3s";

    setTimeout(() => {

        if (type === 'admin') {

            window.location.href = "admin-login.html";

        } else if (type === 'student') {

            // 🔥 GO TO SERVICE SELECTION FIRST
            window.location.href = "student-service.html";

        } else {

            window.location.href = "visitor-service.html";
        }

    }, 300);
}

/* LIVE QUEUE DISPLAY */
function updateLiveQueue() {

    try {

        let queue = JSON.parse(localStorage.getItem("cmQueue")) || {
            current: null,
            list: []
        };

        document.getElementById("currentQueue").innerText =
            queue.current ? queue.current.number : "---";

        document.getElementById("status").innerText =
            queue.current
                ? "Now Serving: " + queue.current.role
                : "No active queue";

        document.getElementById("count").innerText =
            "People waiting: " + queue.list.length;

    } catch (error) {

        console.log("Queue loading error");

    }
}

/* AUTO LIVE UPDATE */
updateLiveQueue();

setInterval(updateLiveQueue, 1000);

</script>

</body>
</html>
