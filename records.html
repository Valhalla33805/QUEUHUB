<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM QueueHub - Data Records Log</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body {
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('background2.jpg') no-repeat center center/cover;
    padding:30px;
}
.container {
    width:100%; max-width:1200px; background:rgba(255,255,255,0.12); backdrop-filter:blur(15px);
    border-radius:25px; padding:40px; box-shadow:0 10px 40px rgba(0,0,0,0.4);
}
h1 { color:#d4f5d4; text-align:center; margin-bottom:5px; }
.subtitle { text-align:center; color:#a8e6a3; margin-bottom:35px; }
.action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px; }
.clear-btn { background:#ff4d4d; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:500; transition:0.3s; }
.clear-btn:hover { background:#cc0000; }
.history-container { width:100%; overflow-x:auto; max-height:500px; overflow-y:auto; border-radius:12px; background:rgba(0,0,0,0.2); }
.history-table { width:100%; border-collapse:collapse; color:white; text-align:left; font-size:14px; }
.history-table th, .history-table td { padding:14px 18px; border-bottom:1px solid rgba(255, 255, 255, 0.08); }
.history-table th { background:rgba(255, 255, 255, 0.15); color:#a8e6a3; font-weight:500; position:sticky; top:0; }
.history-table tbody tr:hover { background:rgba(255, 255, 255, 0.05); }
.tag { padding:3px 8px; border-radius:6px; font-size:12px; font-weight:bold; }
.tag-student { background:#2196f3; color:white; }
.tag-visitor { background:#ff9800; color:white; }
.tag-cut { background:#ff4d4d; color:white; font-style: italic; }
.empty { color:#ccc; padding:30px; text-align:center; font-size:16px; }
.close-link { display:block; margin:25px auto 0; width:max-content; color:#ccc; text-decoration:none; font-size:14px; transition:0.3s; }
.close-link:hover { color:white; }
</style>
</head>
<body>
<div class="container">
    <h1>📊 Served Data Archives Logs</h1>
    <div class="subtitle">Complete Transactional Record History Storage</div>

    <div class="action-bar">
        <span style="color: white; font-weight: bold;" id="totalCountDisplay">Total Compiled Items: 0</span>
        <button class="clear-btn" onclick="clearLogsHistory()">🗑️ Wipe Archive Logs Data</button>
    </div>

    <div class="history-container">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Queue No.</th>
                    <th>Name</th>
                    <th>User Classification</th>
                    <th>Purpose of Visit</th>
                    <th>Terminal Window</th>
                    <th>Service Duration</th>
                </tr>
            </thead>
            <tbody id="historyLogBody">
                <tr><td colspan="7" class="empty">No records compiled yet.</td></tr>
            </tbody>
        </table>
    </div>
   <a href="admin.html" class="close-link">✖ Close Archive Window</a>
</div>

<script>
function renderRecordsTable() {
    const data = JSON.parse(localStorage.getItem("cmQueue")) || { logsHistory: [] };
    const historyBody = document.getElementById("historyLogBody");
    const countDisplay = document.getElementById("totalCountDisplay");
    const logsList = data.logsHistory || [];

    countDisplay.textContent = `Total Compiled Items: ${logsList.length}`;

    if(logsList.length === 0){
        historyBody.innerHTML = `<tr><td colspan="7" class="empty">No records compiled yet.</td></tr>`;
        return;
    }

    historyBody.innerHTML = "";
    logsList.forEach(log => {
        let typeClass = log.userType === "Visitor" ? "tag-visitor" : "tag-student";
        let statusBadge = "";
        
        // Render Cut Off markers visually 
        if(log.status && log.status.startsWith("Cut Off")) {
            typeClass = "tag-cut";
            statusBadge = `<br><span style="color:#ff8888; font-size:11px;">⚠️ ${log.status}</span>`;
        }

        // Fallback Date Logic: If log.date doesn't exist, generate today's date format
        let recordDate = log.date || new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });

        historyBody.innerHTML += `
            <tr>
                <td><span style="color: #a8e6a3;">${recordDate}</span></td>
                <td><strong>${log.number}</strong></td>
                <td>${log.name}</td>
                <td><span class="tag ${typeClass}">${log.userType || "User"}</span>${statusBadge}</td>
                <td>${log.purpose}</td>
                <td>Window ${log.window} <span style="opacity:0.5; font-size:11px;">(${log.timestamp || '--:--'})</span></td>
                <td><code>${log.timeTaken}</code></td>
            </tr>`;
    });
}

function clearLogsHistory() {
    if(!confirm("Are you completely sure you want to permanently empty the text logging datasets? This cannot be undone.")) return;
    const currentData = JSON.parse(localStorage.getItem("cmQueue")) || {};
    currentData.logsHistory = [];
    localStorage.setItem("cmQueue", JSON.stringify(currentData));
    renderRecordsTable();
}

window.addEventListener('storage', (e) => {
    if (e.key === 'cmQueue') renderRecordsTable();
});
renderRecordsTable();
</script>
</body>
</html>
